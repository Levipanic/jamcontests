{{define "team_new.html"}}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{.CSRFToken}}">
  <meta name="referrer" content="no-referrer">
  <title>Новое дело: команда</title>
  <link rel="stylesheet" href="/static/css/app.css?v=3">
</head>
<body>
  <main class="dossier">
    <header>
      <p>Дело джема № {{.PublicJamID}}</p>
      <h1>Завести дело команды</h1>{{template "help_trigger"}}
    </header>
    {{if .Error}}<p role="alert">{{.Error}}</p>{{end}}
    {{if .Rules}}
    <details class="rules-paper">
      <summary>Правила дела</summary>
      <p>{{.Rules}}</p>
    </details>
    {{end}}
    <form method="post" action="/jams/{{.PublicJamID}}/teams/new" enctype="multipart/form-data">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
      <label>Название
        <input name="name" required minlength="2" maxlength="60" autocomplete="off">
      </label>
      <label>Описание
        <textarea name="description" maxlength="1000" rows="8"></textarea>
      </label>
      <label>Аватар команды (JPEG, PNG или WebP)
        <input name="avatar" type="file" accept="image/jpeg,image/png,image/webp">
      </label>
      {{if .Rules}}
      <label class="rules-confirm"><input type="checkbox" name="rules_confirmed" value="yes" required> Я ознакомлен с правилами проведения джема</label>
      {{end}}
      <button type="submit">Создать команду</button>
    </form>
    <p><a href="/jams/{{.PublicJamID}}">Вернуться к джему</a></p>
  </main>
{{template "help_dialog"}}
<script src="/static/js/app.js?v=2" defer></script>
</body>
</html>
{{end}}
