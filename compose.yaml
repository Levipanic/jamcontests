services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jamcontests
      POSTGRES_USER: jamcontests
      POSTGRES_PASSWORD: jamcontests
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jamcontests -d jamcontests"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
